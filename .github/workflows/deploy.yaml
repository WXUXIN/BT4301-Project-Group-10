name: Production Readiness Check
on:
  push:
    branches: [ etl-improvements ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: pip install flake8 black

      - name: Check Code Format (Black)
        run: black --check .
        # This fails if your code isn't formatted correctly

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # This catches syntax errors and undefined variables

  docker-verify:
    needs: quality-check # Only runs if code is "clean"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker-compose config
        # This verifies your yaml syntax is valid for production

      - name: Build Check
        run: docker-compose build
        # This ensures the Dockerfile can actually compile without errors