name: Production Readiness Check
on:
  push:
    branches: [ etl-improvements ]

jobs:
  syntax-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        # This compiles the files to bytecode. If there is a syntax error, it fails.
        run: python -m py_compile deploy_to_production/*.py dataops/**/*.py

      - name: Validate Docker Setup
        # Checks if your docker-compose.yml is valid and can build
        run: |
          docker-compose config
          docker-compose build