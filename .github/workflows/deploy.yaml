name: Production Readiness Check
on:
  push:
    branches: [ etl-improvements ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        # This compiles the files to bytecode. If there is a syntax error, it fails.
        run: python -m py_compile deploy_to_production/*.py 

      - name: Install YAML Linter
        run: pip install yamllint

      - name: Verify Docker YAML Syntax
        # This checks for indentation and structural errors in your docker file
        run: yamllint deploy_to_production/compose.yaml